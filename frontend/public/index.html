<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoolOps AI: Connectivity Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.4rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
    .status { margin-top: 1rem; font-style: italic; color: #555; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>CoolOps AI: Connectivity Test</h1>
  <p>Synthetic demo only. Checks that this page can reach the backend, Gemini, and Firestore.</p>

  <button id="run">Run checks</button>
  <p class="status" id="status"></p>

  <h2>Health</h2>
  <pre id="health">Not run yet.</pre>

  <h2>Firestore write and read</h2>
  <pre id="firestore">Not run yet.</pre>

  <h2>Gemini</h2>
  <pre id="gemini">Not run yet.</pre>

  <script>
    async function check(path, outputId) {
      const out = document.getElementById(outputId);
      out.className = "";
      out.textContent = "Loading...";
      try {
        const res = await fetch(path);
        const body = await res.text();
        if (!res.ok) {
          out.className = "error";
          out.textContent = `HTTP ${res.status}\n${body}`;
          return false;
        }
        out.textContent = JSON.stringify(JSON.parse(body), null, 2);
        return true;
      } catch (err) {
        out.className = "error";
        out.textContent = `Request failed: ${err.message}`;
        return false;
      }
    }

    document.getElementById("run").addEventListener("click", async () => {
      const status = document.getElementById("status");
      status.textContent = "Running checks...";
      const results = await Promise.all([
        check("/api/health", "health"),
        check("/api/firestore-test", "firestore"),
        check("/api/gemini-test", "gemini"),
      ]);
      status.textContent = results.every(Boolean)
        ? "All checks passed."
        : "One or more checks failed. See the sections above.";
    });
  </script>
</body>
</html>
